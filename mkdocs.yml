site_name: pyhellofresh
site_description: Async Python client for the HelloFresh API
site_url: https://pantherale0.github.io/pyhellofresh/
repo_url: https://github.com/pantherale0/pyhellofresh
repo_name: pantherale0/pyhellofresh
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Home: index.md
  - Guides:
      - Authentication: authentication.md
      - Sessions: sessions.md
      - Account: account.md
      - Deliveries and meals: deliveries.md
      - Menus and recipes: menus.md
      - Pricing: pricing.md
      - Errors: errors.md
      - Development: development.md
  - API reference:
      - Client: api/client.md
      - Models: api/models.md
      - Exceptions: api/errors.md

watch:
  - src/pyhellofresh

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            heading_level: 2
            filters:
              - "!^_[^_]"
            merge_init_into_class: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pantherale0/pyhellofresh
