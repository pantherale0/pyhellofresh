[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhellofresh"
authors = [{ name = "Jordan Harvey" }]
description = "Async Python Client library for HelloFresh API"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "dataclasses-json>=0.6.0",
    "idna>=3.0",
    "yarl>=1.9.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "anyio>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
]

[project.urls]
Source = "https://github.com/pantherale0/pyhellofresh"

[tool.setuptools.package-data]
pyhellofresh = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "pyhellofresh.__version__" }

[tool.black]
line-length = 88
fast = true

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--cov-report xml:coverage.xml --cov src --cov-fail-under 0 --cov-append"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
show_error_codes = true
strict = true
ignore_missing_imports = true
warn_unused_configs = true
